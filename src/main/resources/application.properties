spring.application.name=SugarLoyalty
server.port=${PORT:${SERVER_PORT:8081}}
server.servlet.session.timeout=24h

# Base de datos (En Render se leen desde las variables de entorno; en local se sobreescriben con application-local.properties)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Correo SMTP (Gmail)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:sugarpopcakes14@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Usuario del Punto de Venta (POS)
spring.security.user.name=${SPRING_SECURITY_USER_NAME:sugarpop}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:sugarpop2026}

# Importa tu configuración local si existe en tu PC
spring.config.import=optional:file:./application-local.properties
