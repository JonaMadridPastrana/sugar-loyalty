<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugar Loyalty - Registro</title>
    <!-- Tailwind CSS desde CDN para dar diseño rápido y moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex flex-col items-center justify-items pt-6 pb-12"
      style="background-image: url('/images/FondoRegistro.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed;">

<div class="-mb-[90px] text-center z-10 relative">
    <img src="/images/LogoBlanco.PNG" alt="Sugar Pop Logo" class="w-66 h-66 mx-auto object-contain drop-shadow-md" onerror="this.style.display='none'">

</div>

<div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-md border border-pink-100 relative z-20">
    <!-- Encabezado con la marca -->
    <div class="text-center mb-6">
        <h1 class="text-3xl font-extrabold text-pink-700">SUGAR POP</h1>
        <p class="text-gray-500 text-sm mt-1">¡Suma puntos y canjea tus postres favoritos!</p>
    </div>

    <!-- Formulario de Registro -->
    <form id="formRegistro" class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Nombre</label>
            <input type="text" id="nombre" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-pink-400 focus:outline-none" placeholder="Tu nombre">
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Apellido</label>
            <input type="text" id="apellido" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-pink-400 focus:outline-none" placeholder="Tu apellido">
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Teléfono (WhatsApp)</label>
            <input type="tel" id="telefono" required pattern="[0-9]{10}" maxlength="10" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-pink-400 focus:outline-none" placeholder="10 dígitos">
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Correo Electrónico</label>
            <input type="email" id="email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-pink-400 focus:outline-none" placeholder="tu@correo.com">
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Fecha de Nacimiento</label>
            <input type="date" id="fechaNacimiento" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-pink-400 focus:outline-none">
        </div>

        <button type="submit" id="btnSubmit" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 rounded-lg shadow-md transition duration-200 mt-2">
            ¡Registrarme y Obtener QR!
        </button>
    </form>

    <!-- Cuadro de Notificación / Mensaje -->
    <div id="mensajeResultado" class="hidden mt-4 p-3 rounded-lg text-center text-sm font-medium"></div>


    <!-- Sección de Código QR para usuarios iOS y Android -->
    <div id="seccionQr" class="mt-6 p-6 bg-white rounded-xl shadow-md border border-pink-100 text-center hidden">
        <h3 class="text-lg font-bold text-gray-800 mb-2">Tu Tarjeta Digital (Código QR)</h3>
        <p class="text-sm text-gray-600 mb-4">Muestra este código QR en caja para acumular puntos rápidamente.</p>

        <!-- Contenedor de la Imagen QR -->
        <div class="flex justify-center mb-4">
            <img id="imagenQrCliente" src="" alt="Código QR de Lealtad" class="w-48 h-48 border-4 border-pink-200 rounded-lg shadow-sm">
        </div>

        <!-- Botón de Descarga -->
        <a id="btnDescargarQr" href="" download="sugar-pop-qr.png"
           class="inline-block bg-pink-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-pink-700 transition">
            Descargar Código QR
        </a>
    </div>
</div>

<!-- Script en JavaScript para conectar el formulario con el Backend -->
<script>
    const csrfToken = document.querySelector('meta[name="_csrf"]').content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

    function headersConCsrf(headers = {}) {
        return {
            ...headers,
            [csrfHeader]: csrfToken
        };
    }

    document.getElementById('formRegistro').addEventListener('submit', async (e) => {
        e.preventDefault();

        const btnSubmit = document.getElementById('btnSubmit');
        btnSubmit.disabled = true;
        btnSubmit.innerText = 'Procesando registro...';

        const telefonoVal = document.getElementById('telefono').value.trim();
        const payload = {
            nombre: document.getElementById('nombre').value.trim(),
            apellido: document.getElementById('apellido').value.trim(),
            telefono: telefonoVal,
            email: document.getElementById('email').value.trim(),
            fechaNacimiento: document.getElementById('fechaNacimiento').value
        };

        const mensajeDiv = document.getElementById('mensajeResultado');
        const seccionQr = document.getElementById('seccionQr');

        seccionQr.classList.add('hidden');

        try {
            const response = await fetch('/api/clientes', {
                method: 'POST',
                headers: headersConCsrf({ 'Content-Type': 'application/json' }),
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok) {
                const nombreCliente = (data.cliente && data.cliente.nombre) ? data.cliente.nombre : payload.nombre;

                mensajeDiv.className = 'mt-4 p-3 rounded-lg text-center text-sm font-medium bg-green-100 text-green-700';
                mensajeDiv.innerHTML = `¡Registro exitoso, <strong>${nombreCliente}</strong>! Ya puedes acumular tus puntos en caja.`;
                mensajeDiv.classList.remove('hidden');

                const urlQr = `/api/clientes/${encodeURIComponent(telefonoVal)}/qr`;
                document.getElementById('imagenQrCliente').src = urlQr;
                document.getElementById('btnDescargarQr').href = `${urlQr}/descargar`;
                seccionQr.classList.remove('hidden');

                document.getElementById('formRegistro').reset();
            } else {
                let errorMsg = 'Error al registrar el cliente.';
                if (data.mensaje) {
                    errorMsg = data.mensaje;
                } else if (data.detalles) {
                    errorMsg = Object.values(data.detalles).join(', ');
                }
                mensajeDiv.className = 'mt-4 p-3 rounded-lg text-center text-sm font-medium bg-red-100 text-red-700';
                mensajeDiv.innerHTML = `<strong>Error:</strong> ${errorMsg}`;
                mensajeDiv.classList.remove('hidden');
            }
        } catch (err) {
            console.error('Error de red:', err);
            mensajeDiv.className = 'mt-4 p-3 rounded-lg text-center text-sm font-medium bg-red-100 text-red-700';
            mensajeDiv.innerHTML = 'Error de conexión con el servidor.';
            mensajeDiv.classList.remove('hidden');
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.innerText = '¡Registrarme y Obtener QR!';
        }
    });
</script>
</body>
</html>
